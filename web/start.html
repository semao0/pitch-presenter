<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Pitch Presenter</title>
<style>
  :root {
    --bg: #14161a; --raise: #1c1f25; --line: #2a2f37; --fg: #ececee; --dim: #7d838d; --faint: #4a505a;
    --accent: #6cb2ff; --bad: #ff6464;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
               font: 15px Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; justify-content: center; padding: 32px 36px; gap: 22px;
         -webkit-user-select: none; user-select: none; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; }
  h1 span { display: block; margin-top: 4px; font-size: 14px; font-weight: 400; color: var(--dim); }
  button, input { font: inherit; color: inherit; }
  .field { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .label { grid-column: 1 / -1; font-size: 13px; color: var(--dim); }
  .file { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 11px 14px; text-align: left;
          background: var(--raise); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .file:hover { border-color: var(--faint); }
  .file b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file small { color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                direction: rtl; flex: 1; text-align: right; }
  .file.empty b { color: var(--dim); font-weight: 400; }
  .clear { width: 44px; background: none; border: 1px solid var(--line); border-radius: 8px; color: var(--dim);
           cursor: pointer; font-size: 18px; }
  .clear:hover { color: var(--fg); border-color: var(--faint); }
  .clear[hidden] { display: none; }
  input[type=number] { width: 100px; padding: 10px 12px; background: var(--raise); border: 1px solid var(--line);
                       border-radius: 8px; outline: none; }
  input[type=number]:focus { border-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 14px; }
  .row .hint { color: var(--faint); font-size: 13px; }
  footer { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
  #status { flex: 1; color: var(--dim); font-size: 13px; }
  #status.bad { color: var(--bad); }
  #go { padding: 11px 26px; background: var(--accent); color: #0b1220; font-weight: 600; border: 0;
        border-radius: 8px; cursor: pointer; }
  #go:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<h1>Pitch Presenter<span>Слайды, текст спикера и таймер — в одном окне</span></h1>

<div class="field">
  <div class="label">Презентация</div>
  <button class="file" id="deck"><b></b><small></small></button>
</div>
<div class="field">
  <div class="label">Текст спикера</div>
  <button class="file" id="notes"><b></b><small></small></button>
  <button class="clear" id="clear" title="Без текста">×</button>
</div>
<div class="field">
  <div class="label">Длительность, мин</div>
  <div class="row"><input type="number" id="minutes" min="0" max="180" step="1"><span class="hint">0 — без ограничения</span></div>
</div>

<footer><span id="status"></span><button id="go">Начать</button></footer>

<script>
const $ = id => document.getElementById(id);
const sel = {deck: null, notes: null};
const empty = {deck: 'Выбрать PDF или PPTX…', notes: 'Выбрать .toml или .md…'};

function show(kind) {
  const p = sel[kind], el = $(kind);
  el.classList.toggle('empty', !p);
  el.querySelector('b').textContent = p ? p.split(/[\\/]/).pop() : empty[kind];
  el.querySelector('small').textContent = p ? p.replace(/[\\/][^\\/]*$/, '') : '';
  if (kind === 'notes') $('clear').hidden = !p;
}
function status(text, bad) { $('status').textContent = text; $('status').className = bad ? 'bad' : ''; }

async function pick(kind) {
  const r = await pywebview.api.pick(kind);
  if (!r) return;
  sel[kind] = r.path;
  if (kind === 'deck' && r.notes && !sel.notes) sel.notes = r.notes;
  show('deck'); show('notes'); status('');
}
async function start() {
  if (!sel.deck) return status('Выберите файл презентации', true);
  $('go').disabled = true; status('Готовлю слайды…');
  const r = await pywebview.api.start(sel.deck, sel.notes, +$('minutes').value || 0);
  if (r && r.error) { status('Ошибка: ' + r.error, true); $('go').disabled = false; }
}

$('deck').onclick = () => pick('deck');
$('notes').onclick = () => pick('notes');
$('clear').onclick = () => { sel.notes = null; show('notes'); };
$('go').onclick = start;
addEventListener('keydown', e => { if (e.key === 'Enter' && !$('go').disabled) start(); });

show('deck'); show('notes');
addEventListener('pywebviewready', async () => {
  const c = await pywebview.api.init();
  Object.assign(sel, {deck: c.deck, notes: c.notes});
  $('minutes').value = c.minutes || 0;
  show('deck'); show('notes');
  $('go').focus();
});
</script>
</body>
</html>
