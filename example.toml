# Текст спикера для Pitch Presenter. Один блок [[slide]] — один слайд.
title = "Объектив"   # название в шапке (необязательно)
minutes = 8          # длительность выступления (необязательно, иначе — из окна запуска)

[[slide]]
n = 1                # номер слайда в PDF — обязательно
title = "Боль"       # подпись над текстом
time = "0:30"        # лимит на слайд: 30, "30s" или "0:30"; без него — по числу слов
text = '''
Происходит ли сейчас на площадке то, что должно быть по плану?

> пауза — ремарка для себя, мелко серым, в хронометраж не входит
'''

[[slide]]
n = 2
title = "Продукт"
text = '''
Абзацы — через пустую строку. **Жирный**, *курсив*, ==подсветить ключевое==.
- списки
- тоже работают
'''

[[slide]]
n = 5
title = "Отчёт"
reserve = true       # жёлтая метка «резерв»
time = 20
text = '''
Если не хватает времени — пропускаем.
'''
