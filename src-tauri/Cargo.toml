[package]
name = "pitch-presenter"
version = "2.0.0"
description = "Presenter view for PDF and PPTX with speaker notes and a timer"
authors = ["semao0 <belousovsemen40@gmail.com>"]
repository = "https://github.com/semao0/pitch-presenter"
edition = "2024"
rust-version = "1.85"

[lib]
name = "pitch_presenter_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-log = "2.10"
tauri-plugin-single-instance = "2.5"

blake3 = { version = "1.8", features = ["pure"] }
log = "0.4"
notify = "8.2"
notify-debouncer-full = "0.7"
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
needless_pass_by_value = "allow"
# Product names (PDFium, LibreOffice) read better without backticks.
doc_markdown = "allow"

# PNG encoding and PDFium glue are hot paths; keep them fast in dev builds too.
[profile.dev.package."*"]
opt-level = 3
